[package]
name = "mp3cutad-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "mp3cutad_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mp3cutad-cli"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "mp3cutad-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
cli = ["clap", "indicatif"]
gui = ["eframe", "egui", "rfd", "pollster", "env_logger", "rodio"]
# GPU 加速（可选）：使用 wgpu 在显卡上批量计算余弦相似度，未启用时走 CPU
gpu = ["dep:wgpu", "dep:bytemuck", "pollster"]

[dependencies]
# FFT 计算
rustfft = "6.2"
num-complex = "0.4"

# 数组/矩阵运算
ndarray = "0.16"
ndarray-rand = "0.15"
rand = "0.8"

# WAV 文件读写
hound = "3.5"

# 并行计算
rayon = "1.10"

# 命令行参数 (仅 bin)
clap = { version = "4.5", features = ["derive"], optional = true }

# 进度条 (仅 bin)
indicatif = { version = "0.17", optional = true }

# GUI (仅 gui bin)
eframe = { version = "0.28", optional = true }
egui = { version = "0.28", optional = true }
rfd = { version = "0.14", optional = true }
pollster = { version = "0.3", optional = true }
env_logger = { version = "0.11", optional = true }
rodio = { version = "0.20", optional = true }

# GPU 计算（仅 gpu feature）
wgpu = { version = "0.20", optional = true }
bytemuck = { version = "1.16", features = ["derive"], optional = true }

# 序列化（模型持久化）
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# FFI 支持
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 状态栏 CPU / GPU 占用率采样
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
