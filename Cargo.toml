[package]
name = "mp3cutad-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "mp3cutad_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mp3cutad-cli"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "mp3cutad-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
cli = ["clap", "indicatif"]
gui = ["eframe", "egui", "rfd", "pollster", "env_logger", "rodio"]

[dependencies]
# FFT 计算
rustfft = "6.2"
num-complex = "0.4"

# 数组/矩阵运算
ndarray = "0.16"
ndarray-rand = "0.15"
rand = "0.8"

# WAV 文件读写
hound = "3.5"

# 并行计算
rayon = "1.10"

# 命令行参数 (仅 bin)
clap = { version = "4.5", features = ["derive"], optional = true }

# 进度条 (仅 bin)
indicatif = { version = "0.17", optional = true }

# GUI (仅 gui bin)
eframe = { version = "0.28", optional = true }
egui = { version = "0.28", optional = true }
rfd = { version = "0.14", optional = true }
pollster = { version = "0.3", optional = true }
env_logger = { version = "0.11", optional = true }
rodio = { version = "0.20", optional = true }

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# FFI 支持
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
